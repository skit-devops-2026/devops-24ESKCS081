groups:
  - name: playbook-alerts
    rules:
      - alert: PlayBookWebDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PlayBook web target is down"
          description: "The nginx exporter reports the PlayBook web service as down for more than 1 minute."
      - alert: PlayBookHighConnectionRate
        expr: rate(nginx_connections_accepted[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unusually high connection rate on PlayBook web"
          description: "Accepted connections exceeded 10 per second for 5 minutes."
